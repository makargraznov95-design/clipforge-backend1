<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>CLIPFORGE AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0a0b0f;--s:#12141a;--b:#232735;--t:#e8ecf3;--m:#8b93a7;--a:#3ea8ff;--a2:#2ce3c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:16px;max-width:900px;margin:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:0 0 4px}h1 span{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;color:transparent}
.muted{color:var(--m);font-size:12px}
.step{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.step h3{margin:0 0 10px;font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:1px}
button{background:linear-gradient(90deg,var(--a),var(--a2));color:#06121c;border:none;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px;margin:4px 6px 4px 0}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:#1b1f2a;color:var(--t);font-weight:500}
label{display:block;margin:8px 0;color:var(--m);font-size:13px}
select,input[type=number],input[type=text],input[type=url]{background:#0e1015;border:1px solid var(--b);color:var(--t);border-radius:8px;padding:9px 10px;font-size:14px;width:100%;margin-top:4px}
video{width:100%;max-height:320px;border-radius:10px;background:#000;margin-top:8px;display:none}
.info{color:var(--m);font-size:12px;margin-top:6px}
.bar{height:6px;background:#1b1f2a;border-radius:9px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .2s}
pre{background:#0e1015;border:1px solid var(--b);border-radius:8px;padding:10px;font-size:11px;max-height:160px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace}
.result{background:#0e1015;border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.result video{max-height:400px}
.result .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style></head><body>

<h1>CLIPFORGE <span>AI</span></h1>
<div class="muted">Ссылка → речь → субтитры → вертикальный MP4 → «Фото».</div>

<div class="step"><h3>1. Видео по ссылке</h3>
<label>Вставь ссылку (YouTube, VK, Instagram, TikTok):
<input type="url" id="url" placeholder="https://youtube.com/watch?v=...">
</label>
<button id="btnUrl" disabled>Скачать видео</button>
<div class="info" id="info"></div>
<video id="prev" controls playsinline></video>
</div>

<div class="step"><h3>2. Настройки</h3>
<label>Язык
<select id="lang"><option value="russian">Русский</option><option value="english">English</option><option value="">Авто</option></select></label>
<label>Длина клипа
<select id="clipLen"><option value="15">15 сек</option><option value="25" selected>25 сек</option><option value="35">35 сек</option><option value="50">50 сек</option></select></label>
<label>Сколько клипов
<select id="clipCount"><option>3</option><option selected>5</option><option>10</option></select></label>
<label>Стиль субтитров
<select id="style"><option value="bold">Bold</option><option value="minimal">Minimal</option><option value="yellow">Yellow</option></select></label>
<label>Разрешение
<select id="res"><option value="720">720×1280 (быстро)</option><option value="1080" selected>1080×1920 (качество)</option></select></label>
</div>

<div class="step"><h3>3. Сделать</h3>
<button id="btnGo" disabled>Найти и собрать</button>
<div class="bar"><i id="pbar"></i></div>
<div class="info" id="status">Ожидание ссылки.</div>
</div>

<div id="results"></div>
<pre id="log"></pre>

<script type="module">
import { FFmpeg } from 'https://esm.sh/@ffmpeg/ffmpeg@0.12.10';
import { toBlobURL, fetchFile } from 'https://esm.sh/@ffmpeg/util@0.12.1';

const $=id=>document.getElementById(id);
const log=m=>{const p=$('log');p.textContent+=m+'\n';p.scrollTop=p.scrollHeight;console.log(m)};
const setP=v=>$('pbar').style.width=(100*Math.max(0,Math.min(1,v))).toFixed(1)+'%';
const setS=t=>$('status').textContent=t;

let file=null, cues=[], clips=[], ffmpeg=null, isDownloading=false;

$('url').oninput=()=>{ $('btnUrl').disabled = !$('url').value.trim() || isDownloading; };

$('btnUrl').onclick = async ()=>{
  const url=$('url').value.trim();
  if(!url) return;
  isDownloading=true; $('btnUrl').disabled=true; $('btnGo').disabled=true;
  setS('Скачивание видео...'); setP(0);
  log('Скачивание: '+url);
  try{
    const fd=new FormData(); fd.append('url', url);
    const r=await fetch('/api/download',{method:'POST',body:fd});
    if(!r.ok){ throw new Error('Сервер: '+r.status+' '+await r.text()); }
    const blob=await r.blob();
    file=new File([blob],'video.mp4',{type:'video/mp4'});
    $('info').textContent=`Скачано: ${(file.size/1048576).toFixed(1)} МБ`;
    const v=$('prev'); v.src=URL.createObjectURL(blob); v.style.display='block';
    v.onloadedmetadata=()=>{
      $('info').textContent+=` — ${v.duration.toFixed(1)} сек`;
      $('btnGo').disabled=false;
      log(`Видео скачано (${v.duration.toFixed(1)} сек)`);
      setS('Видео готово. Нажми «Найти и собрать».');
    };
  }catch(e){
    log('ОШИБКА: '+(e?.message||e));
    setS('Не удалось скачать видео.');
  }finally{
    isDownloading=false;
    $('btnUrl').disabled=!$('url').value.trim();
  }
};

async function ensureFF(){
  if(ffmpeg) return ffmpeg;
  setS('Загрузка FFmpeg...'); log('FFmpeg загрузка...');
  ffmpeg=new FFmpeg();
  ffmpeg.on('log',({message})=>{ if(/error|Error|Invalid|failed/i.test(message)) log('ffmpeg: '+message); });
  const b='https://unpkg.com/@ffmpeg/core@0.12.10/dist/esm';
  await ffmpeg.load({
    coreURL: await toBlobURL(b+'/ffmpeg-core.js','text/javascript'),
    wasmURL: await toBlobURL(b+'/ffmpeg-core.wasm','application/wasm'),
    classWorkerURL: location.origin+'/worker.js',
  });
  try{
    log('Шрифт...');
    const fBlob=await (await fetch('https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/DejaVuSans-Bold.ttf')).blob();
    await ffmpeg.writeFile('font.ttf', new Uint8Array(await fBlob.arrayBuffer()));
  }catch(e){ log('Шрифт: '+e.message); }
  log('FFmpeg OK');
  return ffmpeg;
}

async function runAsr(){
  setS('Распознавание речи...'); setP(0.2);
  const fd=new FormData();
  fd.append('file', file);
  const langMap={russian:'ru',english:'en','':'auto'};
  fd.append('language', langMap[$('lang').value]||'auto');
  log('Отправка на бэкенд...');
  const r=await fetch('/api/transcribe',{method:'POST',body:fd});
  if(!r.ok){ throw new Error('Бэкенд: '+r.status+' '+await r.text()); }
  const j=await r.json();
  cues=(j.cues||[]).map(c=>({start:c.start,end:c.end,text:c.text}));
  log(`Распознано: ${cues.length} фраз (${j.language}, ${j.duration.toFixed(1)} сек)`);
  setP(0.7);
  return cues;
}

function analyze(dur,minLen,maxLen,count){
  const wins=[];
  if(cues.length){
    for(let i=0;i<cues.length;i++){
      let start=cues[i].start, end=start, text='', j=i;
      while(j<cues.length && (end-start)<maxLen){
        text+=(text?' ':'')+cues[j].text; end=cues[j].end;
        if((end-start)>=minLen && /[.!?…]$/.test(cues[j].text.trim())) break;
        j++;
      }
      const len=end-start;
      if(len<minLen || len>maxLen+3) continue;
      wins.push({start:Math.max(0,start-0.15),end:Math.min(dur,end+0.15),text,score:scoreText(text)});
    }
  }
  if(!wins.length){
    const step=Math.max(minLen, dur/(count*2));
    for(let t=0;t+minLen<=dur;t+=step) wins.push({start:t,end:Math.min(dur,t+minLen),text:'',score:0.1});
  }
  const sorted=wins.sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const w of sorted){
    if(picked.length>=count) break;
    if(!picked.some(p=>{const o=Math.max(0,Math.min(p.end,w.end)-Math.max(p.start,w.start));const u=Math.min(p.end-p.start,w.end-w.start);return u && o/u>0.4;})) picked.push(w);
  }
  return picked.sort((a,b)=>a.start-b.start);
}
function scoreText(t){const l=t.toLowerCase();let s=0;if(/[!?]/.test(t))s+=0.6;if(/почему|как|что|когда|зачем|кто/.test(l))s+=0.5;if(/главное|представь|интересн|смешн|удивительн|секрет|шок/.test(l))s+=0.8;if(/ха-ха|хаха|смех|лол|прикол/.test(l))s+=0.6;return s;}

async function renderClip(i, clip){
  const W=+$('res').value; const H=Math.round(W*16/9);
  const dur=clip.end-clip.start;
  const base=`scale=${W}:${H}:force_original_aspect_ratio=increase,crop=${W}:${H}`;
  const st=$('style').value;
  const stMap={bold:{color:'white',bw:5,bc:'black',fs:Math.round(W*0.06),y:`h-th-${Math.round(H*0.14)}`},minimal:{color:'white',bw:2,bc:'black@0.6',fs:Math.round(W*0.052),y:`h-th-${Math.round(H*0.12)}`},yellow:{color:'#ffea00',bw:5,bc:'#12002b',fs:Math.round(W*0.067),y:`h-th-${Math.round(H*0.14)}`}}[st];
  const esc=t=>t.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/:/g,'\\:').replace(/%/g,'\\%').replace(/,/g,'\\,');
  const draws=[];
  for(const c of cues){
    const s=Math.max(0,c.start-clip.start), e=Math.min(dur,c.end-clip.start);
    if(e<=0||s>=dur||!c.text) continue;
    const words=c.text.split(/\s+/); const lines=[]; let cur='';
    for(const w of words){ if((cur+' '+w).trim().length<=22) cur=(cur+' '+w).trim(); else {lines.push(cur); cur=w;} }
    if(cur) lines.push(cur);
    const text=lines.slice(0,2).join('\\n');
    draws.push(`drawtext=fontfile=font.ttf:text='${esc(text)}':fontsize=${stMap.fs}:fontcolor=${stMap.color}:borderw=${stMap.bw}:bordercolor=${stMap.bc}:x=(w-text_w)/2:y=${stMap.y}:enable='between(t\\,${s.toFixed(2)}\\,${e.toFixed(2)})'`);
  }
  const vf=base+(draws.length?','+draws.join(','):'');
  const args=['-hide_banner','-ss',String(clip.start),'-t',String(dur),'-i','src.mp4','-vf',vf,'-c:v','mpeg4','-qscale:v','4','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','-y','o'+i+'.mp4'];
  await ffmpeg.exec(args);
  const data=await ffmpeg.readFile('o'+i+'.mp4');
  const blob=new Blob([data.buffer],{type:'video/mp4'});
  try{ await ffmpeg.deleteFile('o'+i+'.mp4'); }catch{}
  return blob;
}

async function saveToPhotos(blob, name){
  const f=new File([blob], name, {type:'video/mp4'});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:name}); return true; }
    catch(e){ if(e.name==='AbortError') return true; }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return false;
}

$('btnGo').onclick=async()=>{
  if(!file) return;
  $('btnGo').disabled=true; setP(0); $('results').innerHTML='';
  try{
    await ensureFF();
    try{ await ffmpeg.readFile('src.mp4'); }
    catch{ await ffmpeg.writeFile('src.mp4', await fetchFile(file)); }

    await runAsr();
    const dur=$('prev').duration||0;
    const len=+$('clipLen').value;
    const count=+$('clipCount').value;
    clips=analyze(dur, Math.max(8,len-8), len+8, count);
    log(`Клипов: ${clips.length}`);
    setS(`Рендер ${clips.length} клипов...`);

    for(let i=0;i<clips.length;i++){
      setP(0.7+0.28*(i/clips.length));
      setS(`Рендер ${i+1}/${clips.length}...`);
      const blob=await renderClip(i, clips[i]);
      const name=`CLIPFORGE_${String(i+1).padStart(2,'0')}.mp4`;
      addResult(name, blob, clips[i]);
      log(`  ${name} — ${(blob.size/1048576).toFixed(2)} МБ`);
    }
    setP(1); setS('Готово.');
  }catch(e){ log('ОШИБКА: '+(e?.message||e)); setS('Ошибка.'); console.error(e); }
  finally{ $('btnGo').disabled=false; }
};

function addResult(name, blob, clip){
  const url=URL.createObjectURL(blob);
  const d=document.createElement('div'); d.className='result';
  d.innerHTML=`<div><b>${name}</b> <span class="muted">· ${clip.start.toFixed(1)}–${clip.end.toFixed(1)} сек · ${(blob.size/1048576).toFixed(2)} МБ</span></div>
    <video controls playsinline src="${url}"></video>
    <div class="row">
      <button data-act="share">📤 Сохранить в Фото</button>
      <button class="sec" data-act="dl">⬇ В «Файлы»</button>
    </div>`;
  d.querySelector('[data-act=share]').onclick=()=>saveToPhotos(blob, name);
  d.querySelector('[data-act=dl]').onclick=()=>{ const a=document.createElement('a'); a.href=url; a.download=name; a.click(); };
  $('results').prepend(d);
}

log('Готово. Вставь ссылку.');
</script></body></html>
